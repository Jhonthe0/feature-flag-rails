services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_SSL: "true"
      COUPONS_ENABLED: ${COUPONS_ENABLED:-false}
      SECRET_KEY_BASE: feature-flag-rails-demo-secret-key-base
    volumes:
      - feature_flag_storage:/rails/storage

volumes:
  feature_flag_storage:
